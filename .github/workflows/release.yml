name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm >= 11.5.1
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # release-manifest.json is the single source of truth for which packages
      # are published. Everything else stays `private: true` and is ignored by
      # Changesets, so it can never be published by accident.
      - name: Verify release manifest is in sync
        run: pnpm manifest:check

      - name: Resolve publishable package filters
        id: manifest
        run: echo "filters=$(node scripts/release-manifest.mjs turbo-filter)" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: pnpm turbo lint ${{ steps.manifest.outputs.filters }}

      - name: Typecheck
        run: pnpm turbo typecheck ${{ steps.manifest.outputs.filters }}

      - name: Build
        run: pnpm turbo build ${{ steps.manifest.outputs.filters }}

      - name: Test
        run: pnpm turbo test ${{ steps.manifest.outputs.filters }}
        env:
          ALTUDE_API_KEY_DEVNET: ${{ secrets.ALTUDE_API_KEY_DEVNET }}
          ALTUDE_SCRYPT_N: '16384'

      - name: Create release PR or publish
        # Prefer NPM_TOKEN when present; otherwise changesets/action falls back to npm
        # Trusted Publishing (OIDC) if it is configured for the target package scope.
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
